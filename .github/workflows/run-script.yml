name: Run run-all.py Script

on:
  schedule:
    # This example runs every day at 12:00 AM UTC (adjust as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to also trigger it manually with a button

jobs:
  run-python:
    runs-on: ubuntu-latest
    # Extends the default timeout to ensure it doesn't close prematurely
    timeout-minutes: 360 

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Script
        run: python run-all.py