name: Run stock screener

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-python:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FINANCIALMODELINGPREP_API_KEY: ${{ secrets.FINANCIALMODELINGPREP_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run scripts
        run: |
          python run_all.py
          python run_all_recent_earnings.py

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: stock-screener-output
          path: |
            data/
            docs/
          if-no-files-found: warn


      - name: Execute Script
        # This maps your GitHub Secrets/Vars to OS Environment Variables
        env:
          MY_ENV_VAR: ${{ secrets.FINANCIALMODELINGPREP_API_KEY }}  # Use 'vars.NAME' if it's a variable
        run: python script.py